name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK en Release
        run: flutter build apk --release --no-shrink

      - name: Renombrar APK resultante
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ERP_Juan_v1.1.apk"

      - name: Subir Artifact del APK
        uses: actions/upload-artifact@v4
        with:
          name: ERP_Juan_v1.1.apk
          path: build/app/outputs/flutter-apk/ERP_Juan_v1.1.apk
